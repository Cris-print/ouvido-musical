<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ouvido Musical</title>
    <meta
      name="description"
      content="Treinamento auditivo musical: escute o acorde e identifique o tipo correto."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Projetinho de música</p>
          <h1>Ouvido Musical</h1>
        </div>
      </header>

      <section class="panel stats-panel" aria-live="polite">
        <div class="stat-card">
          <span class="label">Pontuação</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">Sequência</span>
          <strong id="streak">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">Melhor</span>
          <strong id="best">0</strong>
        </div>
      </section>

      <section class="panel controls-panel">
        <div class="level-switch" aria-label="Seleção de nível">
          <button class="level-btn active" data-level="basic">Básico</button>
          <button class="level-btn" data-level="intermediate">Intermediário</button>
          <button class="level-btn" data-level="advanced">Avançado</button>
        </div>

        <button id="play-btn" class="play-btn">Tocar acorde</button>
        <p id="message" class="message neutral" aria-live="polite">
          Selecione um nível e toque o primeiro acorde.
        </p>
      </section>

      <section class="panel choices-panel">
        <div id="choices" class="choices" aria-live="polite"></div>
      </section>
    </main>

    <script src="assets/js/app.js"></script>
  </body>
</html>
